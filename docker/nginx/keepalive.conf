# Upstream keep-alive as the nginx documentation writes it:
# https://nginx.org/en/docs/http/ngx_http_upstream_module.html#keepalive
upstream app {
  server app:4000;
  keepalive 16;
}

server {
  listen 80;

  location / {
    proxy_pass http://app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
  }
}
